function dev(){const u=navigator.userAgent;const os=/iPhone/.test(u)?'iPhone':/iPad/.test(u)?'iPad':/Android/.test(u)?'Android':/Windows/.test(u)?'Windows':/Mac OS X/.test(u)?'Mac':'Other';
 const br=/Line\//.test(u)?'LINE':/Edg\//.test(u)?'Edge':/CriOS|Chrome\//.test(u)?'Chrome':/FxiOS|Firefox\//.test(u)?'Firefox':/Safari\//.test(u)?'Safari':'Browser';return os+' · '+br}
class E extends Error{constructor(c){super(c);this.c=c}}
async function open_(code){
 let j;
 try{const r=await fetch(P.a,{method:'POST',body:JSON.stringify({c:code,n:P.n,d:dev()})});j=await r.json()}catch(_){throw new E('net')}
 if(!j||!j.ok)throw new E((j&&j.e)||'bad');
 const key=await crypto.subtle.importKey('raw',ub(j.k),'AES-GCM',false,['decrypt']);
 let gz;try{gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(P.i)},key,ub(P.d))}catch(_){throw new E('key')}
 const html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
 try{sessionStorage.setItem('bby_fp_user',j.name||'')}catch(_){}
 return html;
}
const MSG={bad:'รหัสไม่ถูกต้อง ลองใหม่อีกครั้ง',off:'รหัสนี้ถูกปิดการใช้งานแล้ว ติดต่อหัวหน้างาน',busy:'มีการใส่รหัสผิดหลายครั้ง กรุณารอ 10 นาทีแล้วลองใหม่',net:'เชื่อมต่อระบบตรวจสิทธิ์ไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่',key:'หน้านี้เก่าแล้ว กรุณารีเฟรชหน้า',server:'ระบบตรวจสิทธิ์ขัดข้อง ลองใหม่อีกครั้ง'};
const f=document.getElementById('f'),go=document.getElementById('go'),err=document.getElementById('err'),pw=document.getElementById('pw'),rm=document.getElementById('rm');
const busy=b=>{go.disabled=b;go.textContent=b?'กำลังตรวจสิทธิ์…':'เปิดดู'};
async function run(code,keep){
 busy(true);err.textContent='';
 try{const html=await open_(code);if(keep)ls.set(K,code);else ls.del(K);document.open();document.write(html);document.close()}
 catch(x){busy(false);const c=x.c||'server';if(c==='bad'||c==='off')ls.del(K);err.textContent=MSG[c]||MSG.server;if(c!=='bad'&&c!=='off')pw.value=code}
}
f.addEventListener('submit',e=>{e.preventDefault();const c=pw.value.trim().toUpperCase();if(c)run(c,rm.checked)});
rm.addEventListener('change',e=>{if(!e.target.checked)ls.del(K)});
const s0=ls.get(K);if(s0)run(s0,true);
})();
